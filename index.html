<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1 Year Anniversary 🥔🥓🏳️‍🌈</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hearts-bg"></div>

    <div class="container">

        <h1>
           <span class="line1">Happy 1 Year Anniversary ❤️</span>
           <span class="line2">Will you still be my love 😍?</span>
        </h1>

        <div class="gif-container">
            <img id="cat-gif"
                 src="https://media.tenor.com/r_2wMCBMnesAAAAi/bubu-bubu-dudu-love.gif">
        </div>

        <!-- 🔘 buttons -->
        <div class="buttons">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>

        <!-- 💬 toast -->
        <div id="tease-toast"></div>

    </div>

    <!-- ⚠️ runaway text：不要預先寫內容（避免 JS 提前觸發） -->
    <div id="runaway-text" style="position:fixed; pointer-events:none;"></div>

    <!-- 🎵 音樂 -->
    <audio id="bg-music" loop>
        <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

    <script src="script.js"></script>
</body>
</html>
