<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1 Year Anniversary ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>
        <span class="line1">Happy 1 Year Anniversary ❤️</span>
        <span class="line2">Will you still be my love 😍?</span>
    </h1>

    <div class="gif-container">
        <img id="cat-gif" src="https://media.tenor.com/r_2wMCBMnesAAAAi/bubu-bubu-dudu-love.gif">
    </div>

    <div class="buttons">
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
    </div>

    <div id="tease-toast"></div>
    <div id="runaway-text">Catch me if you can 😜</div>
</div>

<audio id="bg-music" loop>
    <source src="music/beabadoobee-glue-song.mp3">
</audio>

<button id="music-toggle" onclick="toggleMusic()">🔊</button>

<script src="script.js"></script>

</body>
</html>
