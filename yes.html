<script>
    const music = document.getElementById("bg-music");

    function toggleMusic() {
        if (music.paused) {
            music.play();
        } else {
            music.pause();
        }
    }

    // 💖 愛心感煙火（穩定版）
    function loveFire() {
        confetti({
            particleCount: 80,
            spread: 80,
            startVelocity: 30,
            origin: { y: 0.6 },
            colors: ["#ff4d6d", "#ff85a2", "#ffb3c1", "#ffffff"],
            shapes: ["circle"]
        });
    }

    // 💥 三連浪漫爆炸（更有層次）
    function burstLove() {
        loveFire();
        setTimeout(loveFire, 250);
        setTimeout(loveFire, 500);
    }

    window.addEventListener("load", () => {

        // 💖 一進來直接告白爆炸
        burstLove();

        // 💖 持續心動煙火
        setInterval(() => {
            burstLove();
        }, 2000);

        // 🎵 背景音樂
        music.volume = 0.3;
        music.play().catch(() => {
            // 自動播放失敗也不會報錯
        });
    });
</script>
