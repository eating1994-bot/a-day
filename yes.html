<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>She said YES ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- 💥 confetti library（一定要） -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="container">
    <h1>She said YES ❤️</h1>
</div>

<audio id="bg-music" loop>
    <source src="music/beabadoobee-glue-song.mp3" type="audio/mpeg">
</audio>

<button id="music-toggle" onclick="toggleMusic()">🔊</button>

<script>
const music = document.getElementById("bg-music")

let started = false

function startMusic() {
    if (!music || started) return

    music.volume = 0.3
    music.play().then(() => {
        started = true
    }).catch(() => {})
}

// =========================
// unlock audio
// =========================
function unlockAudio() {
    startMusic()

    document.removeEventListener("click", unlockAudio)
    document.removeEventListener("touchstart", unlockAudio)
}

document.addEventListener("click", unlockAudio)
document.addEventListener("touchstart", unlockAudio)

// =========================
// toggle music
// =========================
window.toggleMusic = function () {
    const btn = document.getElementById("music-toggle")

    if (!music) return

    if (music.paused) {
        music.play()
        if (btn) btn.textContent = "🔊"
    } else {
        music.pause()
        if (btn) btn.textContent = "🔇"
    }
}

// =========================
// confetti safe
// =========================
function softFire(){
    if (typeof confetti !== "function") return

    confetti({
        particleCount: 40,
        spread: 60,
        origin: { y: 0.7 },
        colors: ["#fff", "#ffe680", "#ffdf80", "#ffd966"]
    })
}

// =========================
// petals
// =========================
function createPetal(){
    const petal = document.createElement("div")
    petal.classList.add("petal")

    const flowers = ["🌼","🌼","💛","✨"]
    petal.innerText = flowers[Math.floor(Math.random()*flowers.length)]

    petal.style.left = Math.random() * 100 + "vw"
    petal.style.animationDuration = (Math.random()*3 + 3) + "s"
    petal.style.fontSize = (Math.random()*18 + 12) + "px"

    document.body.appendChild(petal)

    setTimeout(() => petal.remove(), 7000)
}

// =========================
// start
// =========================
window.addEventListener("load", () => {

    softFire()
    setInterval(softFire, 4000)
    setInterval(createPetal, 300)
})

</script>

</body>
</html>
