<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YES ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- 💥 必須有 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="container">
    <h1>She said YES ❤️</h1>

    <button id="music-toggle" onclick="toggleMusic()">🔊</button>
</div>

<audio id="bg-music" loop>
    <source src="music/beabadoobee-glue-song.mp3" type="audio/mpeg">
</audio>

<script>
let musicPlaying = false

function safeConfetti(){
    if(typeof confetti !== "function") return

    confetti({
        particleCount: 60,
        spread: 70,
        origin: { y: 0.6 },
        colors: ["#fff","#ffe680","#ff69b4","#ffdf00"]
    })
}

function createPetal(){
    const p = document.createElement("div")
    p.innerText = "💖"
    p.style.position = "fixed"
    p.style.left = Math.random()*100 + "vw"
    p.style.top = "-10px"
    p.style.fontSize = "20px"

    document.body.appendChild(p)

    let y = 0
    const fall = setInterval(()=>{
        y += 2
        p.style.top = y + "px"
        if(y > window.innerHeight){
            clearInterval(fall)
            p.remove()
        }
    },20)
}

function startMusic(){
    const music = document.getElementById("bg-music")
    if(!music) return

    music.volume = 0.3
    music.play().catch(()=>{})
}

function toggleMusic(){
    const music = document.getElementById("bg-music")
    const btn = document.getElementById("music-toggle")

    if(!music) return

    if(music.paused){
        music.play()
        btn.textContent = "🔊"
    }else{
        music.pause()
        btn.textContent = "🔇"
    }
}

window.addEventListener("load", () => {

    safeConfetti()
    setInterval(safeConfetti, 4000)
    setInterval(createPetal, 500)

    startMusic()
})

document.addEventListener("click", startMusic, { once:true })

</script>

</body>
</html>
