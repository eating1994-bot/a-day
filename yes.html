<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Year Together 🌼</title>

<link rel="stylesheet" href="style.css">

<!-- 💥 confetti 必須 -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<style>
body{
    background: linear-gradient(135deg, #FFF6D6, #FFE7A3, #FFF0C9);
}

.petal {
    position: fixed;
    top: -10vh;
    font-size: 20px;
    pointer-events: none;
    z-index: 9999;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(120vh) rotate(360deg);
    }
}

.container {
    animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

</head>

<body>

<div class="container yes-container">

    <h1>1 Year Together 🌼</h1>

    <div class="gif-container">
        <img src="https://media.tenor.com/0cNM_9li440AAAAi/dudu-giving-flowers-bubu-flowers.gif" width="200">
    </div>

    <p>One year ago, we officially became a couple 💛</p>
    <p>Thank you for staying with me 🌼</p>
    <p>I love you 💛</p>

</div>

<!-- 🎵 音樂 -->
<audio id="bg-music" loop>
    <source src="music/glue-song.mp3" type="audio/mpeg">
</audio>

<button id="music-toggle" onclick="toggleMusic()">🔊</button>

<script>
const music = document.getElementById("bg-music")

let started = false

// =========================
// 🔊 音樂安全啟動
// =========================
function startMusic(){
    if(!music || started) return

    music.volume = 0.3
    music.play().then(()=>{
        started = true
    }).catch(()=>{})
}

document.addEventListener("click", startMusic, { once:true })
document.addEventListener("touchstart", startMusic, { once:true })

// =========================
// 🔊 toggle
// =========================
function toggleMusic(){
    if(!music) return

    if(music.paused){
        music.play()
        document.getElementById("music-toggle").textContent = "🔊"
    }else{
        music.pause()
        document.getElementById("music-toggle").textContent = "🔇"
    }
}

// =========================
// 💥 confetti safe
// =========================
function softFire(){
    if(typeof confetti !== "function") return

    confetti({
        particleCount: 40,
        spread: 60,
        startVelocity: 20,
        origin: { y: 0.7 },
        colors: ["#fff", "#ffe680", "#ffdf80", "#ffd966"]
    })
}

// =========================
// 🌼 petals
// =========================
function createPetal(){
    const petal = document.createElement("div")
    petal.classList.add("petal")

    const flowers = ["🌼","🌼","💛","✨"]
    petal.innerText = flowers[Math.floor(Math.random()*flowers.length)]

    petal.style.left = Math.random()*100 + "vw"
    petal.style.animationDuration = (Math.random()*3 + 3) + "s"
    petal.style.fontSize = (Math.random()*18 + 12) + "px"

    document.body.appendChild(petal)

    setTimeout(()=>petal.remove(), 7000)
}

// =========================
// 🚀 start
// =========================
window.addEventListener("load", () => {

    softFire()
    setInterval(softFire, 4000)
    setInterval(createPetal, 300)

    startMusic()
})
</script>

</body>
</html>
